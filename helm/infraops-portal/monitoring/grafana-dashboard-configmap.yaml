apiVersion: v1
kind: ConfigMap
metadata:
  name: infraops-grafana-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  infraops-dashboard.json: |
    {
      "title": "InfraOps Portal",
      "schemaVersion": 39,
      "panels": [
        {"type": "stat", "title": "Assets", "targets": [{"expr": "infraops_assets_total"}], "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}},
        {"type": "stat", "title": "Offline Assets", "targets": [{"expr": "infraops_assets_offline"}], "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}},
        {"type": "stat", "title": "Open Tickets", "targets": [{"expr": "infraops_tickets_open"}], "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}},
        {"type": "stat", "title": "Critical Tickets", "targets": [{"expr": "infraops_tickets_critical"}], "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}}
      ]
    }

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infraops-backend-monitor
  namespace: observability
  labels:
    release: kube-prom-stack  # Changed from kube-prometheus-stack to match your actual microk8s installation name
spec:
  selector:
    matchLabels:
      app: infraops-backend
  namespaceSelector:
    matchNames:
      - infraops
  endpoints:
  - port: http
    path: /api/monitoring/metrics 

---
apiVersion: v1
kind: Service
metadata:
  name: kube-prom-stack-grafana
  namespace: observability
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 32100
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prom-stack

