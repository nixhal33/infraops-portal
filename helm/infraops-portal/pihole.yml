apiVersion: v1
kind: Namespace
metadata:
  name: dns-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: dns-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        env:
        - name: TZ
          value: "UTC"
        - name: WEBPASSWORD
          value: "admin123"  # 🔐 Change this to your preferred admin dashboard password
        - name: FTLCONF_LOCAL_IPV4
          value: "192.168.50.212"
        ports:
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 80
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns-service
  namespace: dns-system
  annotations: # ➕ ADDED
    metallb.universe.tf/loadBalancerIPs: "192.168.50.212"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - port: 53
    targetPort: 53
    protocol: UDP
    name: dns-udp
  - port: 53
    targetPort: 53
    protocol: TCP
    name: dns-tcp
  - port: 80
    targetPort: 80
    protocol: TCP
    name: pihole-admin
  selector:
    app: pihole
