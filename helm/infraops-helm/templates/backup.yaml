{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-backup-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: {{ .Values.mariadb.image }}
              env:
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: infraops-secret
                      key: MYSQL_PASSWORD
              command:
                - /bin/sh
                - -c
                - mariadb-dump -h infraops-mariadb -u {{ .Values.mariadb.user }} -p"${MYSQL_PASSWORD}" {{ .Values.mariadb.database }} > /backups/infraops-$(date +%Y%m%d-%H%M%S).sql
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: mariadb-backup-pvc
{{- end }}
