name: InfraOps Portal CI/CD

on:
  push:
    tags:
      - 'v*'

env:
  FRONTEND_IMAGE: kubenix/infraops-frontend
  BACKEND_IMAGE: kubenix/infraops-backend

jobs:

####################################################
# TESTS
####################################################

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      ##################################
      # Frontend Build Test
      ##################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend Install
        working-directory: frontend
        run: npm install

      - name: Frontend Build
        working-directory: frontend
        run: npm run build

      ##################################
      # Backend Tests
      ##################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Backend Tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest

####################################################
# SECURITY CHECK
####################################################

  security:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      ##################################
      # Secrets Scan
      ##################################

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##################################
      # Dockerfile Scan
      ##################################

      - name: Hadolint Frontend
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: frontend/Dockerfile

      - name: Hadolint Backend
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: backend/Dockerfile

      ##################################
      # Source Code Scan
      ##################################

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

####################################################
# BUILD + PUSH
####################################################

  docker:
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##################################
      # FRONTEND
      ##################################

      - name: Build Frontend
        run: |
          docker build \
          -t $FRONTEND_IMAGE:${{ github.ref_name }} \
          -f frontend/Dockerfile \
          frontend

      ##################################
      # BACKEND
      ##################################

      - name: Build Backend
        run: |
          docker build \
          -t $BACKEND_IMAGE:${{ github.ref_name }} \
          -f backend/Dockerfile \
          backend

      ##################################
      # IMAGE SCAN
      ##################################

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL

      ##################################
      # PUSH
      ##################################

      - name: Push Frontend
        run: docker push $FRONTEND_IMAGE:${{ github.ref_name }}

      - name: Push Backend
        run: docker push $BACKEND_IMAGE:${{ github.ref_name }}

