apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: infraops
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mariadb:11.4
              env:
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: infraops-secret
                      key: MYSQL_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  mkdir -p /backups
                  mariadb-dump -h infraops-mariadb -u infraops -p"${MYSQL_PASSWORD}" infraops > /backups/infraops-$(date +%Y%m%d-%H%M%S).sql
                  find /backups -type f -mtime +7 -delete
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: mariadb-backup-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-backup-pvc
  namespace: infraops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
