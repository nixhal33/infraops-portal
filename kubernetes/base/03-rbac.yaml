apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: infraops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: infraops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraops-readonly
  namespace: infraops
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-readonly-binding
  namespace: infraops
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: infraops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infraops-readonly
