apiVersion: v1
kind: ConfigMap
metadata:
  name: infraops-prometheus-scrape-example
  namespace: monitoring
data:
  scrape-config.yaml: |
    scrape_configs:
      - job_name: infraops-backend
        metrics_path: /api/monitoring/metrics
        static_configs:
          - targets:
              - infraops-backend.infraops.svc.cluster.local:8000
